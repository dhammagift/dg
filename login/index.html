    <style>
        body { 
            display: flex; 
            flex-direction: column;
            min-height: 100vh; 
            margin: 0; 
        }
        
        /* Навигация строго по верхнему краю */
        .top-nav-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-icon {
            color: #989898 !important;
            font-size: 24px; 
            transition: color 0.2s;
        }
        .nav-icon:hover {
            color: var(--bs-body-color) !important;
        }
        
        /* Плашка синхронизации */
        .sync-wrapper { 
            max-width: 450px; 
            width: 100%; 
            border-radius: 16px; 
            padding: 30px; 
            margin: 90px auto 40px auto; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            background-color: var(--bs-body-bg, #ffffff);
            color: var(--bs-body-color, #212529);
        }

        /* ЖЕСТКОЕ ПЕРЕОПРЕДЕЛЕНИЕ ДЛЯ ТЕМНОЙ ТЕМЫ */
        body.dark .sync-wrapper,
        [data-bs-theme="dark"] .sync-wrapper, 
        [data-theme="dark"] .sync-wrapper {
            background-color: #212529 !important;
            border-color: #343a40 !important;
            color: #f8f9fa !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
        }

        /* Улучшение читаемости серого текста в темной теме */
        body.dark .text-muted, [data-bs-theme="dark"] .text-muted, [data-theme="dark"] .text-muted,
        body.dark .opacity-75, [data-bs-theme="dark"] .opacity-75, [data-theme="dark"] .opacity-75 {
            color: #ced4da !important;
            opacity: 1 !important;
        }

        .logo-placeholder { text-align: center; font-size: 3.5rem; margin-bottom: 10px; line-height: 1; }
        
        .status-card { 
            border-radius: 10px; 
            padding: 15px; 
            background: rgba(128, 128, 128, 0.05);
        }

        #sync-phrase-value-status { 
            font-family: monospace; 
            padding: 2px 6px; 
            border-radius: 4px; 
            background: rgba(128, 128, 128, 0.1);
        }
        
        .sync-mini-btn { padding: 4px 10px; font-size: 0.85rem; }
        
        .danger-link { cursor: pointer; text-decoration: none; font-size: 0.85rem; }
        .danger-link:hover { text-decoration: underline; opacity: 0.8; }
        
        .logout-link { cursor: pointer; text-decoration: none; font-size: 0.85rem; transition: 0.2s; }
        .logout-link:hover { text-decoration: underline; }
    </style>

                    <a class="danger-link text-danger" onclick="uiDeleteAccount()">

    <script>
        const isRu = window.location.pathname.match(/\/(ru|r|ml)\//) || localStorage.getItem('siteLanguage') === 'ru';
        
        document.addEventListener("DOMContentLoaded", () => {
            // Адаптация ссылок "Домик" и "Лупа"
            if (isRu) {
                const navHomeLink = document.getElementById('nav_home_link');
                if (navHomeLink) navHomeLink.href = "/ru/";
                const navSearchLink = document.getElementById('nav_search_link');
                if (navSearchLink) navSearchLink.href = "/ru/?q=";
            }

            // Переключатель En/Ru (В виде кнопок)
            const switcher = document.getElementById('lang-switcher');
            if (switcher) {
                const currentPath = window.location.pathname;
                const currentSearch = window.location.search;
                let ruPath, enPath;

                if (isRu) {
                    enPath = currentPath.replace(/^\/(ru|r|ml)\//, '/');
                    switcher.innerHTML = `
                        <a class="btn btn-sm btn-secondary rounded-pill py-0 px-2 text-decoration-none me-1" href="${enPath + currentSearch}" onclick="localStorage.siteLanguage = 'en';">En</a>
                        <span class="py-0 text-muted px-2">Ru</span>
                    `;
                } else {
                    ruPath = '/ru' + (currentPath === '/' ? '' : currentPath);
                    switcher.innerHTML = `
                        <span class="py-0 px-2 text-muted me-1">En</span>
                        <a class="btn btn-sm btn-secondary rounded-pill py-0 px-2 text-decoration-none" href="${ruPath + currentSearch}" onclick="localStorage.siteLanguage = 'ru';">Ru</a>
                    `;
                }
            }
        });

        function uiLoginPhrase() {
            const input = document.getElementById('sync-phrase-input');
            const phrase = input.value;
            if (phrase && phrase.trim().length >= 8) {
                const syncPhraseId = "phrase_" + phrase.trim().toLowerCase().replace(/\s+/g, '-');
                if (typeof showBubbleNotification === 'function') showBubbleNotification(isRu ? "Синхронизация включена" : "Sync enabled");
                input.value = ''; 
                syncEnablePhrase(syncPhraseId);
            } else {
                alert(isRu ? "Фраза слишком короткая! Нужно минимум 8 символов." : "Passphrase too short! Minimum 8 characters needed.");
            }
        }

        function uiDeleteAccount() {
            const msg = isRu 
                ? "Удалить ваши данные из облака? \n\n(Вся локальная история и закладки на этом устройстве сохранятся)." 
                : "Delete your data from the cloud? \n\n(Local history and bookmarks on this device will be kept).";
            if (confirm(msg)) {
                syncDeleteData();
                if (typeof showBubbleNotification === 'function') showBubbleNotification(isRu ? "Облако очищено" : "Cloud cleared");
            }
        }

        function uiToggleEyeInput() {
            const input = document.getElementById('sync-phrase-input');
            const eyeBtn = document.getElementById('btn-toggle-eye');
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            eyeBtn.innerHTML = isPass ? '<i class="fa-solid text-muted fa-eye-slash"></i>' : '<i class="fa-solid text-muted fa-eye"></i>';
        }

        function uiToggleEyeStatus() {
            const valueSpan = document.getElementById('sync-phrase-value-status');
            const realSpan = document.getElementById('sync-phrase-real-status');
            const eyeBtn = document.getElementById('sync-status-eye-btn');
            const isHidden = realSpan.style.display === 'none';
            
            realSpan.style.display = isHidden ? 'inline' : 'none';
            valueSpan.style.display = isHidden ? 'none' : 'inline';
            eyeBtn.innerHTML = isHidden ? '<i class="fa-solid text-muted fa-eye-slash"></i>' : '<i class="fa-solid text-muted fa-eye"></i>';
        }

        function getFormattedTime() {
            const ts = localStorage.getItem('lastSyncTime');
            if (!ts) return isRu ? "Никогда" : "Never";
            
            const date = new Date(parseInt(ts));
            return date.toLocaleString(isRu ? 'ru-RU' : 'en-US', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
            });
        }

        window.renderLoginPageUI = function(user, phraseId) {
            const el = (id) => document.getElementById(id);

            const t = isRu ? {
                title: "Облачная синхронизация", desc: "Сохраняйте историю, избранное и настройки.",
                google: "Войти через Google", or: "или", phraseLabel: "Войти Анонимно по Секретной фразе",
                hint: "Минимум 8 символов. Это безопасный и полностью анонимный способ синхронизировать данные с любого устройства.", 
                loginPhrase: "Анонимный вход",
                statusLabelGoogle: "Подключено через Google:", statusLabelPhrase: "Анонимное подключение по фразе:",
                syncLabel: "Синхронизировано:", lblSync: "Синхр.",
                logout: "Выйти", delete: "Удалить мои данные из облака"
            } : {
                title: "Cloud Sync", desc: "Sync your history, favorites, and settings.",
                google: "Sign in with Google", or: "or", phraseLabel: "Login Anonymously with Secret Passphrase",
                hint: "Min 8 chars. This is a safe and completely anonymous way to sync data across devices.", 
                loginPhrase: "Anonymous Login",
                statusLabelGoogle: "Connected via Google:", statusLabelPhrase: "Connected anonymously via phrase:",
                syncLabel: "Last synced:", lblSync: "Sync",
                logout: "Logout", delete: "Delete my cloud data"
            };

            el('sync-page-title').textContent = t.title;
            el('sync-page-desc').textContent = t.desc;
            el('btn-google-login').innerHTML = `<i class="fa-brands fa-google me-2"></i> ${t.google}`;
            el('sync-or').textContent = t.or;
            el('sync-phrase-label').textContent = t.phraseLabel;
            el('sync-hint').textContent = t.hint;
            el('btn-phrase-login').textContent = t.loginPhrase;
            
            el('sync-time-label').textContent = t.syncLabel;
            el('lbl-sync').textContent = t.lblSync;
            el('lbl-logout').textContent = t.logout;
            el('lbl-delete').textContent = t.delete;
            el('sync-last-time').textContent = getFormattedTime();

            if (user || phraseId) {
                el('sync-logged-out').style.display = 'none';
                el('sync-logged-in').style.display = 'block';

                if (user) {
                    el('sync-status-label').textContent = t.statusLabelGoogle;
                    el('sync-user-info').textContent = user.email;
                } else {
                    el('sync-status-label').textContent = t.statusLabelPhrase;
                    const realPhrase = phraseId.replace('phrase_', '');
                    const starsPhrase = '•'.repeat(realPhrase.length);
                    
                    el('sync-user-info').innerHTML = `
                        <div class="d-flex align-items-center">
                            <span id="sync-phrase-value-status" style="letter-spacing: 2px;">${starsPhrase}</span>
                            <span id="sync-phrase-real-status" class="text-primary" style="display:none; font-family: monospace; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(128, 128, 128, 0.1);">${realPhrase}</span>
                            <button class="btn btn-sm p-0 ms-2 opacity-75" style="border:0; background:transparent;" type="button" onclick="uiToggleEyeStatus()" id="sync-status-eye-btn">
                                <i class="fa-solid text-muted fa-eye"></i>
                            </button>
                        </div>`;
                }
            } else {
                el('sync-logged-out').style.display = 'block';
                el('sync-logged-in').style.display = 'none';
            }
        };
    </script>
