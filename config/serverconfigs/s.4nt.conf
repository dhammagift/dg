<VirtualHost *:80>
  ServerName  s.dhamma.gift
  ServerAlias www.s.dhamma.gift

  ServerAdmin webmaster@localhost
  DocumentRoot /var/www/html/4nt

  <Directory /var/www/html/4nt>
      AllowOverride All
      Require all granted
      Options -Indexes
  </Directory>


RewriteEngine On

RewriteRule ^4nt/(.*)$ /$1 [R=301,L]
RewriteRule ^4nt$ / [R=301,L]


  # === Логи и ошибки ===
  ErrorLog ${APACHE_LOG_DIR}/test_error.log
  CustomLog ${APACHE_LOG_DIR}/test_access.log combined

#  ErrorDocument 404 /assets/404.php
</VirtualHost>


