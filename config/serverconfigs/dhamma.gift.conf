<VirtualHost *:80>

  ServerName dhamma.gift
  ServerAlias www.find.dhamma.gift find.dhamma.gift www.dhamma.gift dhamma.gift f.dhamma.gift www.f.dhamma.gift f2.dhamma.gift www.f2.dhamma.gift 


	ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined


ErrorDocument 404 /assets/404.php

</VirtualHost>
