<VirtualHost *:80>
  ServerName d.dhamma.gift
  ServerAlias www.d.dhamma.gift

  ServerAdmin webmaster@localhost
  DocumentRoot /var/www/dpr

  <Directory /var/www/dpr>
      AllowOverride All
      Require all granted
      Options -Indexes
  </Directory>

  # === Логи и ошибки ===
  ErrorLog ${APACHE_LOG_DIR}/test_error.log
  CustomLog ${APACHE_LOG_DIR}/test_access.log combined

  ErrorDocument 404 /assets/404.php
</VirtualHost>


