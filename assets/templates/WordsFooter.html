    <script type='text/javascript'>
   $(document).ready(function() {
      DataTable.util.diacritics(d => d);
   var dataSrc = [];
   
     var filterValue = new URLSearchParams(window.location.search).get('s');
     
	 var table = $('#pali').DataTable({

		   buttons: [
  {
    text: 'Main',

    action: function () {
      window.location.href = "/";
    }
  },
  {
    text: 'History',
    className: 'btn btn-link',
    action: function () {
      window.location.href = '/history.php';
    }
  },
  {
    extend: 'collection',
    text: 'Export',
    className: 'btn btn-link',
    buttons: [
      {
        extend: 'copyHtml5',
	      exportOptions: {
          columns: function (idx, data, node) {
            return $('#pali').DataTable().column(idx).visible();
          },
          modifier: {
            search: 'applied'
          }
        }
      },
      {
        extend: 'excelHtml5',
	      exportOptions: {
          columns: function (idx, data, node) {
            return $('#pali').DataTable().column(idx).visible();
          },
          modifier: {
            search: 'applied'
          }
        }
      },
      {
        extend: 'csvHtml5',
	      exportOptions: {
          columns: function (idx, data, node) {
            return $('#pali').DataTable().column(idx).visible();
          },
          modifier: {
            search: 'applied'
          }
        }
      },
      {
        text: 'TXT',
        action: function (e, dt, node, config) {
          var data = dt.buttons.exportData({
            columns: function (idx) {
              return dt.column(idx).visible();
            },
            modifier: { search: 'applied' }
          });
          
          var textContent = [];
          
          // Заголовки, разделенные табуляцией
          textContent.push(data.header.join('\t'));
          
          // Строки
          data.body.forEach(function(row) {
            var cleanRow = row.map(function(cell) {
              return typeof cell === 'string' ? cell.replace(/\r?\n|\r/g, ' ') : cell;
            });
            textContent.push(cleanRow.join('\t'));
          });
          
          // Динамическое формирование имени файла из <title> страницы
          var filename = document.title !== '' ? document.title : 'Export';
          // Очистка имени файла от недопустимых символов (поведение по умолчанию DataTables)
          filename = filename.replace(/[^a-zA-Z0-9_\u00A1-\uFFFF\.,\-_ !\(\)]/g, "");
          
          var blob = new Blob([textContent.join('\n')], { type: 'text/plain;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          
          var a = document.createElement('a');
          a.href = url;
          a.download = filename + '.txt';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      }
    ]
  },
  {

  }
],
     
        
'paging'  : true,

      'initComplete': function(){

         // Populate a dataset for autocomplete functionality
         api.cells('tr', [0, 1, 2, 3]).every(function(){
            //var data = this.data().replace( /(<([^>]+)>)/ig, '');
            var data = $('<div>').html(this.data()).text();
          //  console.log(data);
            if(dataSrc.indexOf(data) === -1){ dataSrc.push(data); }
         });

         // Initialize Typeahead plug-in
         $('.dataTables_filter input[type="search"]', api.table().container())
            .typeahead({
              autoSelect: false,
               source: dataSrc,
               afterSelect: function(value){
                  api.search(value).draw();
               }
            }
         );
      }
   });			
          if (filterValue) {
        table.search(filterValue).draw();
        var currentUrl = new URL(window.location.href);
        currentUrl.searchParams.delete('s');
        history.replaceState({}, '', currentUrl);
}

});
